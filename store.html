<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="🟢 Nkrumah Ave - Premium Street Wear Collection. Shop exclusive tees, shorts, hoodies, shoes & bags. Fast delivery across Ghana.">
    <meta name="theme-color" content="#00ff00">
    <title>Store Details</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Store Header -->
    <header class="store-banner">
        <h1>Store Name</h1>
        <p>Location: City, State</p>
        <p>Category: Clothing</p>
    </header>

    <!-- Store Description -->
    <section class="store-description">
        <p>A description of the store goes here. This is a place to tell users about your business.</p>
    </section>

    <!-- Product Grid -->
    <section class="product-grid">
        <h2>Products</h2>
        <div class="grid-container">
            <!-- Dynamic product cards -->
            <div class="product-card" onclick="location.href='product_detail.html';">
                <img src="product1.jpg" alt="Product 1">
                <h3>Product Name</h3>
                <p>$25.00</p>
            </div>
            <div class="product-card">
                <img src="product2.jpg" alt="Product 2">
                <h3>Product Name</h3>
                <p>$30.00</p>
            </div>
            <!-- Add more dynamically -->
        </div>
    </section> 
</body>
</html>
