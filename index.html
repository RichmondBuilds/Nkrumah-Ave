<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nkrumah Ave - Street Wear</title>
    <style>
        .store-banner {
            background: linear-gradient(90deg, #00ff00, #00cc00, #00ff44);
            padding: 14px 20px;
            text-align: center;
            color: #000;
        }
        .store-banner h1 {
            font-size: 1.6em;
        }
        .store-description, .product-grid {
            margin: 20px;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }
        .product-card {
            padding: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- Store Header -->
    <div class="store-banner">
        <h1>Nkrumah Ave</h1>
        <p>Sunyani, Ghana</p>
        <p>Category: Premium Street Wear</p>
    </div>

    <!-- Store Description -->
    <section class="store-description">
        <h2>About the Store</h2>
        <p>Shop exclusive tees, shorts, hoodies, shoes, and bags. Premium streetwear collection delivering value and authenticity!</p>
    </section>

    <!-- Product Grid -->
    <section class="product-grid">
        <h2>Products</h2>
        <div class="grid-container">
            <div class="product-card">
                <img src="product1.jpg" alt="Product 1">
                <h3>Black Hoodie</h3>
                <p>$35.00</p>
                <button>Add to Cart</button>
            </div>
            <div class="product-card">
                <img src="product2.jpg" alt="Product 2">
                <h3>Streetwear Tee</h3>
                <p>$22.00</p>
                <button>Add to Cart</button>
            </div>
        </div>
    </section>
</body>
</html>
